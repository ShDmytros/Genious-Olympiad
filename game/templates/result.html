{% extends 'base.html' %} {% load static %} {% block content %}


<div class="flex items-center justify-center h-full w-full gap-[100px] max-lg:flex-col">
    <div class="w-2/3 h-[400px] items-center justify-center bg-white rounded-2xl p-5 flex flex-col gap-5 shadow-2xl text-center">
        <h1 class="text-3xl font-bold">Your score is {{ score }}/{{max_score}}</h1>
        <p class="font-bold">{{ message }}</p>

        <a href="{% url 'game' %}" class="bg-main-color text-white h-[80px] w-full rounded-2xl font-bold text-[20px] shadow-2xl flex items-center justify-center">
            Play again
        </a>
    </div>
</div>


{% endblock %}
