{% extends 'base.html' %} {% load static %} {% block content %}


<div class="flex justify-between h-full w-full gap-[100px] items-center max-lg:flex-col">
    <form method="post" id="playForm" action="" class="flex flex-col gap-10 w-full">
        {% csrf_token %}


        <input type="hidden" name="problem_id" value="{{ problem.id }}">


        <div class="flex flex-col gap-2">
            <div class="p-3 bg-main-color w-max text-white text-3xl rounded-2xl font-bold">
                <p>{{task}}/{{max_tasks_number}} | Your score is {{score}}</p>
            </div>
            <h1 class="text-4xl font-bold" id="problem_title">{{problem.name}}</h1>
            <p id="problem_description">{{problem.description}}</p>    
                   
        </div>

        <div class="flex flex-col gap-3">
            <label class="font-bold text-[20px]" for="explaining">
                Your text (<span id="text_length">0</span>/100 symbols):
            </label>

            <textarea
                class="rounded-2xl shadow-2xl p-[10px]"
                id="explaining"
                name="explaining"
                rows="5"
                maxlength="100"
                placeholder="Your answear..."
                required
            ></textarea>
        </div>

        <button name="action" value="check" type="submit" class="bg-main-color text-white h-[80px] rounded-2xl font-bold text-[20px] shadow-2xl">
            Check
        </button>
    </form>
</div>    

<div id="loadingScreen" class="loadingScreen font-bold flex-col text-center">
  <h1>Processing request...</h1>
  <h1>Please, wait a little bit</h1>
</div>

<script src="{% static 'game/js/form.js' %}?v={{ STATIC_VERSION }}"></script>


{% endblock %}
