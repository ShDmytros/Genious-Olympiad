{% extends 'base.html' %} {% block content %} {% load static %} {% load i18n %} {% load static i18n %}

<section class="flex flex-col justify-center flex-wrap gap-10">
  <div class="flex gap-5 items-center justify-start">
    <a href="{% url 'news' %}">
      <img class="w-[90px]" src="{% static 'core/img/buttons/back.png' %}?v={{ STATIC_VERSION }}" alt="">
    </a>

    <div class="bg-main-color w-max h-full p-4 text-white flex flex-col justify-start items-start rounded-xl font-bold gap-2">
      <p class="text-[14px] text-start">{{news.date}}</p>
      <p class="text-[14px] text-start">Author: {{news.author}}</p>
    </div>    
  </div>

    <h3 class="font-bold text-3xl max-lg:text-3xl max-md:text-2xl text-center">{{news.title}}</h3>

  <img
    class="h-[400px] w-full object-cover rounded-xl shadow-xl bg-white"
    src="{{news.image.url}}"
    alt=""
  />
    <p class="text-[16px] text-justify">{{news.content|linebreaks}}</p>
</a>
</section>

{% endblock %}
