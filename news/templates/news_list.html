{% extends 'base.html' %} {% block content %} {% load static %} {% load i18n %} {% load static i18n %}

<section class="flex justify-center flex-wrap gap-10">
  {% for news in news_list %}

  <a
  href="{{ news.get_absolute_url }}"
  class="white-selection bg-main-color w-[300px] h-[500px] p-5 text-white hover:bg-[#999] duration-200 shadow-2xl rounded-2xl flex flex-col justify-between"
>
  <img
    class="h-[150px] w-full object-cover rounded-xl shadow-xl bg-white brightness-50"
    src="{{news.image.url}}"
    alt=""
  />

  <h3 class="font-bold text-2xl text-start">{{news.title}}</h3>
  <p class="text-[14px] text-start">{{news.content|truncatewords:20}}</p>

  <p class="text-[14px] text-start">
    {{ news.date|date:"F j, Y" }} | {{ news.author }}
  </p>

</a>
  {% endfor %}
</section>

{% endblock %}
